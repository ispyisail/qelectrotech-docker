services:

  # ── Normal run (Release build, GUI via X11) ──────────────────────────────
  qet:
    build:
      context: .
      target: runtime
      args:
        BUILD_TYPE: Release
    image: qelectrotech:release
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1        # avoids MIT-SHM errors on some X servers
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # X11 socket
      - qet-home:/home/qet                  # persist user projects
    network_mode: host                       # simplest for X11; see notes below
    stdin_open: true
    tty: true

  # ── Test suite (ctest via Xvfb virtual display) ─────────────────────────
  qet-test:
    build:
      context: .
      target: test
    image: qelectrotech:test

  # ── Debug build — GDB attached, source tree mounted ─────────────────────
  qet-debug:
    build:
      context: .
      target: debug
    image: qelectrotech:debug
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
    network_mode: host
    stdin_open: true
    tty: true

  # ── Valgrind memory check — logs to ./valgrind-logs/ ────────────────────
  qet-valgrind:
    build:
      context: .
      target: debug
    image: qelectrotech:debug
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
      - ./valgrind-logs:/valgrind-logs
    network_mode: host
    command: >
      valgrind
        --tool=memcheck
        --leak-check=full
        --show-leak-kinds=all
        --track-origins=yes
        --log-file=/valgrind-logs/valgrind.log
        qelectrotech

volumes:
  qet-home:
