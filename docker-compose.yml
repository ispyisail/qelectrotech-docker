services:

  # ── Normal run (Release build, GUI via X11) ──────────────────────────────
  qet:
    build:
      context: .
      target: runtime
      args:
        BUILD_TYPE: Release
    image: qelectrotech:release
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1        # avoids MIT-SHM errors on some X servers
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # X11 socket
      - qet-home:/home/qet                  # persist user projects
    network_mode: host                       # simplest for X11; see notes below
    stdin_open: true
    tty: true

  # ── Test suite (ctest via Xvfb virtual display) ─────────────────────────
  qet-test:
    build:
      context: .
      target: test
    image: qelectrotech:test

  # ── Debug build — GDB attached, source tree mounted ─────────────────────
  qet-debug:
    build:
      context: .
      target: debug
    image: qelectrotech:debug
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
    network_mode: host
    stdin_open: true
    tty: true

  # ── Valgrind memory check — logs to ./valgrind-logs/ ────────────────────
  qet-valgrind:
    build:
      context: .
      target: debug
    image: qelectrotech:debug
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
      - ./valgrind-logs:/valgrind-logs
    network_mode: host
    command: >
      valgrind
        --tool=memcheck
        --leak-check=full
        --show-leak-kinds=all
        --track-origins=yes
        --log-file=/valgrind-logs/valgrind.log
        qelectrotech

  # ── ThreadSanitizer — data race detection ───────────────────────────────
  qet-tsan:
    build:
      context: .
      target: tsan
    image: qelectrotech:tsan
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./tsan-logs:/tsan-logs
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true

  # ── AddressSanitizer — memory error detection ────────────────────────────
  qet-asan:
    build:
      context: .
      target: asan
    image: qelectrotech:asan
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./asan-logs:/asan-logs
    network_mode: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true

  # ── GUI Fuzzer — stress-tests all UI operations headlessly ─────────────
  # Run: docker compose run --rm qet-fuzz
  # Or for a long overnight run:
  #   FUZZER_HOURS=8 FUZZER_SPEED=fast docker compose run --rm qet-fuzz
  # Logs written to ./fuzzer-logs/ — analyse with:
  #   docker compose run --rm qet-fuzz python3 /fuzzer/analyze.py
  qet-fuzz:
    build:
      context: .
      target: fuzzer
    image: qelectrotech:fuzzer
    environment:
      - FUZZER_HOURS=${FUZZER_HOURS:-1}
      - FUZZER_SPEED=${FUZZER_SPEED:-normal}
      - FUZZER_SEED=${FUZZER_SEED:-}
      - FUZZER_LOG_DIR=/fuzzer/logs
    volumes:
      - ./fuzzer-logs:/fuzzer/logs
    cap_add:
      - SYS_PTRACE

  # ── Fuzzer with AddressSanitizer — memory error detection ───────────────
  qet-fuzz-asan:
    build:
      context: .
      target: fuzzer-asan
    image: qelectrotech:fuzzer-asan
    environment:
      - FUZZER_HOURS=${FUZZER_HOURS:-1}
      - FUZZER_SPEED=${FUZZER_SPEED:-slow}
      - FUZZER_SEED=${FUZZER_SEED:-}
      - FUZZER_LOG_DIR=/fuzzer/logs
      - ASAN_OPTIONS=halt_on_error=0:log_path=/fuzzer/logs/asan:detect_leaks=1
    volumes:
      - ./fuzzer-asan-logs:/fuzzer/logs
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # ── Fuzzer with ThreadSanitizer — data race detection ───────────────────
  qet-fuzz-tsan:
    build:
      context: .
      target: fuzzer-tsan
    image: qelectrotech:fuzzer-tsan
    environment:
      - FUZZER_HOURS=${FUZZER_HOURS:-1}
      - FUZZER_SPEED=${FUZZER_SPEED:-slow}
      - FUZZER_SEED=${FUZZER_SEED:-}
      - FUZZER_LOG_DIR=/fuzzer/logs
      - TSAN_OPTIONS=halt_on_error=0:log_path=/fuzzer/logs/tsan:second_deadlock_stack=1:history_size=7
    volumes:
      - ./fuzzer-tsan-logs:/fuzzer/logs
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # ── EDZ feature branch — EPLAN importer ────────────────────────────────
  qet-edz:
    build:
      context: .
      target: edz
    image: qelectrotech:edz
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
    network_mode: host
    stdin_open: true
    tty: true

  # ── Combined test build for manual review ──────────────────────────────
  # master + #646/#647 (diagnostic logging), #625/#628/#629/#630 (discussion
  # #503 wiring-database stack), #661 (CLI modal-dialog hang fix) and the
  # element_info orphan-row fix (fix-element-info-orphan-row). Throwaway
  # branch, not a proposed change -- see test-build-logging-wiring on the
  # ispyisail fork. Rebuild with a new TESTBUILD_REV to pick up moves.
  qet-testbuild:
    build:
      context: .
      target: testbuild
    image: qelectrotech:testbuild
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - qet-home:/home/qet
    network_mode: host
    stdin_open: true
    tty: true

  # ── Elements repo fetch (10_electric only) ─────────────────────────────
  # Clones qelectrotech/qelectrotech-elements (the repo the elements/
  # submodule in qelectrotech-source-mirror points at) and copies out just
  # 10_electric -- for IEC 81346 classification work (discussion #666).
  # Run: docker compose run --rm qet-elements-10-electric
  # Output lands in ./elements-10-electric/ on the host.
  qet-elements-10-electric:
    build:
      context: .
      target: elements-10-electric
    image: qelectrotech:elements-10-electric
    volumes:
      - ./elements-10-electric:/host-out
    entrypoint: ["sh", "-c", "cp -r /out/10_electric /out/FETCHED_FROM.txt /host-out/ && chown -R 1000:1000 /host-out && echo 'Copied 10_electric to ./elements-10-electric/'"]

  # ── EDZ importer fuzzer — malformed file corpus + ASAN ────────────────────
  # Run: docker compose run --rm qet-edz-fuzz
  # Logs written to ./edz-fuzz-logs/
  qet-edz-fuzz:
    build:
      context: .
      target: edz-fuzzer
    image: qelectrotech:edz-fuzzer
    environment:
      - EDZ_FUZZ_LOG_DIR=/edz-fuzzer/logs
    volumes:
      - ./edz-fuzz-logs:/edz-fuzzer/logs
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # ── Save-determinism corpus ───────────────────────────────────────────────
  # Run: docker compose run --rm qet-determinism                  (gate)
  #      docker compose run --rm qet-determinism --write-baseline (record)
  # Reuses the qet-test image, which has both the built binary and the 23
  # example projects at /src/examples. Headless via --resave, no Xvfb needed.
  qet-determinism:
    image: qelectrotech:test
    build:
      context: .
      target: test
    working_dir: /work
    entrypoint: ["bash", "run.sh"]
    volumes:
      - ./tests/determinism:/work

  # ── PR #519 targeted ASan regression tests ────────────────────────────────
  # Compiles each leak fix LEGACY-vs-patched and runs both under ASan to prove
  # the fixes remove their leaks with no use-after-free / double-free.
  # Run: docker compose run --rm qet-asan-regression
  # Reuses the qet-test image (g++, Qt5 dev, ASan); writes report.md + raw/.
  qet-asan-regression:
    image: qelectrotech:test
    build:
      context: .
      target: test
    working_dir: /work
    entrypoint: ["bash", "run.sh"]
    volumes:
      - ./tests/asan-regression:/work
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  qet-home:
